[project]
name = "drella"
version = "0.0.0"
description = "A self-hosted factory where AI agents do the work, on Kubernetes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "cryptography>=44",
    "fastapi>=0.115",
    "kubernetes>=31",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
drella = "drella.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drella"]

[tool.pytest.ini_options]
testpaths = ["tests"]
