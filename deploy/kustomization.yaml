apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: drella
labels:
  - pairs:
      app.kubernetes.io/part-of: drella
resources:
  - namespace.yaml
  - postgres.yaml
  - drella.yaml
  - job-network.yaml
secretGenerator:
  # Postgres is only reachable from the drella pod (see the NetworkPolicy in
  # postgres.yaml). Change the password here before deploying if you like.
  - name: postgres
    literals:
      - password=drella
  # Optional: Drella's GitHub App, so Drella mints repo jobs' GitHub tokens itself
  # (deploy/README.md). Keep the key out of this checkout: create the Secret with
  # kubectl, or generate it in an overlay next to the .pem, e.g.
  #
  #   - name: drella-github-app
  #     files:
  #       - private-key.pem=drella-bot.pem
  #     literals:
  #       - app-id=<the App's ID>
  # Optional, with the superstar profile (issue #73): a second App, its Secret the same
  # shape with the name drella-github-app-superstar (deploy/README.md).
  #
  #   - name: drella-github-app-superstar
  #     files:
  #       - private-key.pem=superstar.pem
  #     literals:
  #       - app-id=<the superstar App's ID>
# Pinned to a release. The drella image launches the drella-job image with the
# same tag, so pinning this one pins both.
images:
  - name: ghcr.io/realitydevices/drella
    newTag: v0.1.0
