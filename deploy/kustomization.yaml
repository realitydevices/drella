apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: drella
labels:
  - pairs:
      app.kubernetes.io/part-of: drella
resources:
  - namespace.yaml
  - postgres.yaml
  - drella.yaml
  - job-network.yaml
secretGenerator:
  # The default password MUST be changed before the first deploy: this repo is
  # public, so everyone knows it. Override it in an overlay (see deploy/README.md).
  # Postgres is only reachable from the drella pod (see the NetworkPolicy in
  # postgres.yaml), which limits the exposure but doesn't replace a real password.
  - name: postgres
    literals:
      - password=drella
  # Optional: Drella's GitHub App, so Drella mints repo jobs' GitHub tokens itself
  # (deploy/README.md). Keep the key out of this checkout: create the Secret with
  # kubectl, or generate it in an overlay next to the .pem, e.g.
  #
  #   - name: drella-github-app
  #     files:
  #       - private-key.pem=drella-bot.pem
  #     literals:
  #       - app-id=<the App's ID>
# Pinned to a release. The drella image launches the drella-job image with the
# same tag, so pinning this one pins both. drella.yaml uses the separate
# DRELLA_DATABASE_* settings, so this must be a release that includes #13
# (v0.5.0 or later); older images ignore them.
images:
  - name: ghcr.io/realitydevices/drella
    newTag: v0.5.0
