# The Drella API, its queue loop, and what it needs to launch jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drella
---
# Must match every k8s API call in drella/runner.py.
# See: drella/runner.py
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drella
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drella
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drella
subjects:
  - kind: ServiceAccount
    name: drella
---
# Local-filesystem storage: archived logs and job outputs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drella-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drella
spec:
  # One replica: the queue loop runs inside the API process.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: drella
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drella
    spec:
      serviceAccountName: drella
      securityContext:
        fsGroup: 1000
      containers:
        - name: drella
          image: ghcr.io/realitydevices/drella
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: DRELLA_DATABASE_URL
              value: postgresql://drella:$(POSTGRES_PASSWORD)@postgres:5432/drella
            - name: DRELLA_STORAGE_PATH
              value: /data
            - name: DRELLA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DRELLA_API_URL
              value: http://drella:8000
            # Drella's GitHub App, which mints repo jobs' GitHub tokens
            # (deploy/README.md). Both come from the optional drella-github-app
            # Secret: without it, Drella still starts, and repo jobs need the
            # caller's own `github` credential.
            - name: DRELLA_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: drella-github-app
                  key: app-id
                  optional: true
            - name: DRELLA_GITHUB_APP_KEY_FILE
              value: /etc/drella/github-app/private-key.pem
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          # Fails if the queue loop has stalled, so Kubernetes restarts Drella.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: github-app
              mountPath: /etc/drella/github-app
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: drella-data
        - name: github-app
          secret:
            secretName: drella-github-app
            optional: true
            items:
              - key: private-key.pem
                path: private-key.pem
            # Readable by Drella (fsGroup 1000) only.
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: drella
spec:
  selector:
    app.kubernetes.io/name: drella
  ports:
    - name: http
      port: 8000
      targetPort: http
