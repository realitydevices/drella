name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: drella
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: pytest (SQLite)
        run: uv run pytest
      - name: pytest (Postgres)
        run: uv run pytest
        env:
          DRELLA_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/drella

  # Pull requests build the images to prove they work, but never publish them
  # (no packages permission here; publishing is images.yml).
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: .
            file: images/drella/Dockerfile
          - context: images/drella-job
            file: images/drella-job/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.file }}

  job-image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: images/drella-job
          file: images/drella-job/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: drella-job:smoke
          cache-from: type=gha,scope=images/drella-job/Dockerfile
      - name: smoke test
        run: |
          docker run --rm --user 1000 --entrypoint bash drella-job:smoke -euo pipefail -c '
            mkdir -p "$HOME/.local/share/opencode" "$HOME/.cache/opencode" "$HOME/.config/opencode"
            python3 --version
            uv --version
            opencode --version
            claude --version
            cd "$(mktemp -d)" && uv init -q smoke && cd smoke && uv run -q python -c "print(\"ok\")"
          '
      - name: wrapper parses
        run: docker run --rm --user 1000 --entrypoint bash drella-job:smoke -c 'bash -n /usr/local/bin/drella-job'
